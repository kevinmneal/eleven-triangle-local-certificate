name: Verify certificate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check public release identities
        run: python3 -B -S tools/check_release.py
      - name: Replay the exact local theorem
        working-directory: certificate
        run: python3 -B -S -O verify_packet.py
      - name: Run all 32 regression and mutation controls
        working-directory: certificate
        run: python3 -B -S -m unittest -v test_source_local_intervals
